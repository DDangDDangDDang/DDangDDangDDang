spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  # 테스트는 로컬 개발용(0번)과 다른 Redis DB를 쓴다.
  # 테스트용 빈 DB의 값(카테고리 캐시 [] 등)이 로컬 서버의 Redis에 남아 화면에 보이지 않게 한다.
  data:
    redis:
      database: 15

jwt:
  secret: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItZGRhbmctZGRhbmctZGRhbmctdGVzdA==
  access-token-validity: 30m
  refresh-token-validity: 14d
  cookie-secure: false

livekit:
  api-url: http://localhost:7880
  ws-url: ws://localhost:7880
  api-key: test-api-key
  api-secret: test-api-secret-test-api-secret-test


# Redis 없이 테스트하도록 이 서버의 구독자에게만 보낸다. 서버 간 전달은 RedisStompBroadcastTest에서 Testcontainers로 확인한다.
websocket:
  broadcast: local

portone:
  api-url: http://localhost
  api-secret: test-secret
  webhook-secret: whsec_dGVzdC13ZWJob29rLXNlY3JldA==


point:
  payout:
    provider: fake
  exchange:
    worker:
      enabled: false   # 테스트 중 스케줄러가 끼어들지 않게 끈다
# 테스트에서는 LiveKit·Redis에 주기적으로 접속하지 않도록 시청자 수 집계를 끈다. 집계는 LiveViewerStatsCollectorTest에서 직접 호출해 확인한다.
live-stream:
  viewer-stats:
    enabled: false
  # 송출 없는 방송 자동 종료도 끈다. 동작은 LiveStreamIdleWatcherTest에서 직접 호출해 확인한다.
  idle:
    enabled: false

# 테스트 중 푸시 서비스로 요청을 보내지 않고, 마감 임박 알림 스케줄러도 끈다. (AuctionAlertControllerTest에서 직접 호출해 확인)
web-push:
  enabled: false
notification:
  closing-soon:
    enabled: false
