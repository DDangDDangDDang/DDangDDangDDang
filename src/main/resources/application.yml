server:
  # 로드밸런서·리버스 프록시 뒤에서 실제 클라이언트 IP를 얻기 위한 설정.
  # 사설망(10.x, 192.168.x 등)에서 온 요청의 X-Forwarded-For만 믿는다. 외부에서 직접 보낸 X-Forwarded-For는 무시한다.
  forward-headers-strategy: native

spring:
  application:
    name: DDangDDangDDang

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ddang?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:ddang}
    password: ${DB_PASSWORD:ddang}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 비관적 락을 기다리는 최대 시간(초). MySQL 기본값은 50초
      # 락을 기다리는 동안 커넥션을 붙잡고 있으므로, 길면 요청이 몰릴 때 커넥션 풀이 고갈
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = ${DB_LOCK_WAIT_TIMEOUT_SECONDS:3}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  mail:
    # Gmail SMTP. 구글 계정 2단계 인증을 켠 뒤 발급한 "앱 비밀번호"를 MAIL_APP_PASSWORD로 주입한다.
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  # Base64로 인코딩된 256비트(32바이트) 이상의 키. 운영 환경에서는 반드시 환경변수로 주입
  secret: ${JWT_SECRET:bG9jYWwtZGV2ZWxvcG1lbnQtand0LXNlY3JldC1rZXktZGRhbmctZGRhbmctZGRhbmc=}
  access-token-validity: 30m
  refresh-token-validity: 14d
  cookie-secure: ${JWT_COOKIE_SECURE:false}

