portone:
  api-url: ${PORTONE_API_URL:https://api.portone.io}
  api-secret: ${PORTONE_API_SECRET:}          # ← 기본값에 실제 시크릿을 넣지 말 것
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:}  # 포트원 콘솔 > 결제연동 > 웹훅 에서 발급

point:
  payout:
    # 실제 송금사가 정해지면 바꾼다. fake는 실제로 돈을 보내지 않는다
    provider: fake
    fake:
      result: SUCCESS          # SUCCESS / FAILED / IN_PROGRESS 로 바꿔서 흐름 확인 가능
  exchange:
    worker:
      enabled: true
      pending-delay-ms: 10000      # PENDING 처리 주기 (10초)
      recovery-delay-ms: 60000     # 복구 확인 주기 (1분)
      stuck-threshold-minutes: 10  # PROCESSING에 10분 넘게 머물면 복구 대상
livekit:
  # 로컬은 livekit-server --dev 기본값. 운영 환경에서는 반드시 환경변수로 주입
  api-url: ${LIVEKIT_API_URL:http://localhost:7880}
  ws-url: ${LIVEKIT_WS_URL:ws://localhost:7880}
  api-key: ${LIVEKIT_API_KEY:devkey}
  api-secret: ${LIVEKIT_API_SECRET:secret}

toss:
  # 토스페이먼츠 테스트 시크릿 키. 운영 환경에서는 반드시 환경변수로 주입
  secret-key: ${TOSS_SECRET_KEY:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}
  base-url: https://api.tosspayments.com
  connect-timeout: 3s
  read-timeout: 30s

app:
  mail:
    # false면 메일을 실제로 보내지 않고 서버 로그에만 출력한다. (로컬 개발용)
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@ddangddangddang.com}
  sms:
    # false면 문자를 실제로 보내지 않고 서버 로그에만 출력한다. (로컬 개발용)
    enabled: ${SMS_ENABLED:false}
    solapi:
      base-url: https://api.solapi.com
      api-key: ${SOLAPI_API_KEY:}
      api-secret: ${SOLAPI_API_SECRET:}
      # SOLAPI 콘솔에 미리 등록한 발신번호. 하이픈 없이 숫자만 (예: 01012345678)
      sender: ${SOLAPI_SENDER:}

management:
  endpoints:
    web:
      exposure:
        # 헬스 체크만 공개한다. (env, beans 등 다른 엔드포인트는 노출하지 않음)
        include: health
  endpoint:
    health:
      # /actuator/health/liveness: 서버 프로세스가 살아 있는지만 본다. ALB 헬스 체크용
      # /actuator/health/readiness: 요청을 받을 준비가 됐는지 본다.
      # DB·Redis가 잠깐 끊겨도 서버를 재시작하지 않도록 ALB는 liveness만 확인한다.
      probes:
        enabled: true
  health:
    # 메일은 선택 기능(MAIL_ENABLED)이라, 설정이 없을 때 전체 상태가 DOWN이 되지 않도록 점검에서 뺀다.
    mail:
      enabled: false
