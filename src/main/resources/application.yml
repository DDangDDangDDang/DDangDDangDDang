spring:
  application:
    name: DDangDDangDDang

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ddang?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:ddang}
    password: ${DB_PASSWORD:ddang}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 비관적 락을 기다리는 최대 시간(초). MySQL 기본값은 50초
      # 락을 기다리는 동안 커넥션을 붙잡고 있으므로, 길면 요청이 몰릴 때 커넥션 풀이 고갈
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = ${DB_LOCK_WAIT_TIMEOUT_SECONDS:3}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  # Base64로 인코딩된 256비트(32바이트) 이상의 키. 운영 환경에서는 반드시 환경변수로 주입
  secret: ${JWT_SECRET:bG9jYWwtZGV2ZWxvcG1lbnQtand0LXNlY3JldC1rZXktZGRhbmctZGRhbmctZGRhbmc=}
  access-token-validity: 30m
  refresh-token-validity: 14d
  cookie-secure: ${JWT_COOKIE_SECURE:false}

livekit:
  # 로컬은 livekit-server --dev 기본값. 운영 환경에서는 반드시 환경변수로 주입
  api-url: ${LIVEKIT_API_URL:http://localhost:7880}
  ws-url: ${LIVEKIT_WS_URL:ws://localhost:7880}
  api-key: ${LIVEKIT_API_KEY:devkey}
  api-secret: ${LIVEKIT_API_SECRET:secret}

toss:
  # 토스페이먼츠 테스트 시크릿 키. 운영 환경에서는 반드시 환경변수로 주입
  secret-key: ${TOSS_SECRET_KEY:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}
  base-url: https://api.tosspayments.com
  connect-timeout: 3s
  read-timeout: 30s
