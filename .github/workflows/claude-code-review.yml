# PR이 열리거나 커밋이 올라오면 Claude Code가 변경을 리뷰하고, 지적은 PR의 해당 줄에 댓글로 남긴다.
# - 인증: 저장소 시크릿 CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`으로 만든 Claude 구독 토큰). 토큰을 만든 사람의 구독 사용량에서 차감된다.
# - 리뷰 기준: 저장소 루트의 REVIEW.md. 리뷰는 한국어로 쓴다.
# - 처음에는 PR 전체를, 그 뒤에는 지난 리뷰 이후 바뀐 커밋만 리뷰한다. 지난 리뷰 지점은 요약 댓글의 표식(claude-review-sha)으로 찾는다.
# - 문서만 바뀐 PR과 드래프트 PR은 리뷰하지 않는다.
name: Claude 코드 리뷰

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

# 같은 PR에 새 커밋이 올라오면 진행 중인 리뷰는 취소한다.
# 취소된 리뷰는 표식을 남기지 않으므로, 다음 리뷰가 그 커밋까지 함께 본다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: 코드 리뷰
    # 드래프트는 건너뛴다. 포크에서 온 PR은 시크릿을 받지 못하므로 같은 저장소 브랜치의 PR만 리뷰한다.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # claude-code-action이 Claude GitHub App으로 인증할 때 쓴다. (댓글은 앱 권한으로 남긴다)
      id-token: write

    steps:
      # 리뷰 범위를 git diff로 계산하고 호출부까지 읽을 수 있도록 전체 이력을 받는다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 지난 리뷰 요약 댓글의 표식에서 리뷰한 커밋을 찾는다. 없거나 강제 푸시로 사라졌으면 PR 전체(머지 베이스부터)를 리뷰한다.
      - name: 리뷰 범위 계산
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          last=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq '.[].body | capture("claude-review-sha: (?<sha>[0-9a-f]{40})").sha' | tail -n 1)
          if [ -n "$last" ] && git cat-file -e "${last}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$last" "$HEAD_SHA"; then
            echo "from=$last" >> "$GITHUB_OUTPUT"
            echo "mode=incremental" >> "$GITHUB_OUTPUT"
          else
            echo "from=$(git merge-base "origin/${BASE_REF}" "$HEAD_SHA")" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.range.outputs.from != github.event.pull_request.head.sha
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 앱 토큰은 기본으로 contents: write를 받는다. 리뷰는 코드를 읽고 댓글만 남기므로 contents는 읽기로 줄인다.
          # (pull_requests·issues는 기본값 write를 그대로 써서 댓글을 남긴다)
          additional_permissions: |
            contents: read
          prompt: |
            저장소 ${{ github.repository }}의 PR #${{ github.event.pull_request.number }}를 리뷰한다.

            리뷰 범위: `git diff ${{ steps.range.outputs.from }}...${{ github.event.pull_request.head.sha }}`
            (모드: ${{ steps.range.outputs.mode }} — full이면 PR 전체, incremental이면 지난 리뷰 이후 올라온 커밋만)

            ## 순서
            1. `gh pr view ${{ github.event.pull_request.number }}`로 PR 제목과 설명을 읽어 작성자의 의도를 파악한다.
            2. 저장소 루트의 REVIEW.md를 읽는다. frontend/ 변경이 있으면 frontend/CLAUDE.md도 읽는다.
            3. 이미 남은 줄 댓글을 `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`로 읽는다. 같은 지적은 다시 남기지 않는다.
            4. 리뷰 범위의 diff를 읽는다. 바뀐 코드마다 diff 밖의 맥락을 Read/Grep으로 직접 확인한다.
               - 바뀐 메서드를 부르는 곳, 바뀐 엔티티·DTO를 쓰는 곳, 같은 자원을 건드리는 다른 서비스
               - 트랜잭션 경계와 락 순서, 이벤트 리스너가 커밋 뒤에 도는지, 권한 검사가 빠진 진입점
               - 프론트엔드라면 API 응답 타입과 실제 백엔드 DTO가 맞는지
            5. 찾은 문제마다 코드를 다시 읽어 정말 문제인지 검증한다. 검증하지 못했으면 "확인 필요"로 표시하고 의심하는 이유를 적는다.
            6. 지적마다 `mcp__github_inline_comment__create_inline_comment`(confirmed: true)로 해당 줄에 댓글을 남긴다.
               - 첫 줄에 심각도를 붙인다: 🔴 버그·보안·데이터 정합성 / 🟠 동시성·성능·누락된 예외 처리 / 🟡 확인 필요
               - 무엇이 왜 문제인지, 어떤 상황에서 터지는지(재현 시나리오), 고치는 방법을 쓴다.
               - 몇 줄로 끝나는 확실한 수정만 suggestion 블록을 단다.
            7. 마지막에 `gh pr comment ${{ github.event.pull_request.number }} --body "..."`로 요약 댓글을 하나 남긴다.
               - 리뷰 범위, 심각도별 지적 개수, 한 줄씩 요약. 지적이 없으면 "지적 없음"과 무엇을 확인했는지.
               - 본문 맨 끝에 반드시 이 줄을 그대로 넣는다: `<!-- claude-review-sha: ${{ github.event.pull_request.head.sha }} -->`

            ## 지적하지 않는 것
            - 리뷰 범위 밖에서 원래 있던 문제(단, 이번 변경 때문에 새로 드러나는 문제는 지적한다)
            - 취향 차이인 스타일, 이름 짓기, 린터·컴파일러가 잡는 것
            - REVIEW.md의 "리뷰하지 않는 것"
          # 모델: 깊은 버그 탐색은 Opus가 가장 낫다. 사용량을 줄이려면 claude-sonnet-5-5로 바꾼다.
          # --max-turns: 큰 PR에서 사용량이 끝없이 늘지 않게 상한을 둔다.
          # 읽기 도구와 PR 조회·댓글 명령만 허용한다. 코드는 고치지 않는다.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch"
            --append-system-prompt "PR 댓글과 요약은 모두 한국어로 쓴다. 리뷰 기준은 저장소 루트의 REVIEW.md다."
