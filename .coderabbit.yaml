# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"
tone_instructions: "한국어로, 간결하고 근거를 들어 리뷰해 주세요."
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - dev

  path_filters:
    - "!build/**"
    - "!.gradle/**"
    - "!.idea/**"
    - "!gradle/wrapper/**"
    - "!**/*.iml"
    - "!HELP.md"

  path_instructions:
    - path: "src/main/java/**/controller/**"
      instructions: |
        - 요청 DTO 검증(@Valid 등)과 적절한 HTTP 상태 코드 사용 여부를 확인하세요.
        - 비즈니스 로직이 컨트롤러에 들어가 있지 않은지 확인하세요.
    - path: "src/main/java/**/service/**"
      instructions: |
        - 트랜잭션 경계(@Transactional, readOnly)가 적절한지 확인하세요.
        - N+1 쿼리, 동시성 문제(포인트 차감 등 race condition)를 중점적으로 봐 주세요.
        - 예외는 공통 에러 코드 체계를 따르는지 확인하세요.
    - path: "src/main/java/**/domain/livechat/**"
      instructions: |
        - WebSocket/STOMP 메시지 처리에서 인증·인가 누락, 구독 경로 권한 검증을 확인하세요.
        - 이벤트 발행/리스너 처리 시 트랜잭션 커밋 이후 실행 여부(@TransactionalEventListener)를 확인하세요.
    - path: "src/main/java/**/domain/auth/**"
      instructions: |
        - 토큰 검증, 쿠키 속성(HttpOnly, Secure, SameSite), 민감 정보 로깅 여부를 확인하세요.
    - path: "src/main/java/**/global/**"
      instructions: |
        - 보안 설정(permitAll 범위 등) 변경이 의도치 않게 엔드포인트를 노출하지 않는지 확인하세요.
    - path: "src/test/**"
      instructions: |
        - 테스트가 실제 동작을 검증하는지, 경계/실패 케이스를 포함하는지 확인하세요.
    - path: "**/*.yml"
      instructions: |
        - 비밀번호, 시크릿 키 등 민감 정보가 하드코딩되어 있지 않은지 확인하세요.

chat:
  auto_reply: true
