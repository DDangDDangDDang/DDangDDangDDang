<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 땅땅땅 탭 아이콘: 헤더 로고(BrandMark)와 같은 번개 망치. 탭 바탕이 밝아도 보이게 어두운 바탕(neutral-25)을 깐다. 색은 디자인 토큰 값(brand-500·brand-200)과 같다. -->
  <!-- 작은 탭에서도 잘 보이게 그림을 1.3배로 키우고 망치 머리를 가운데로 옮겼다. 손잡이 끝은 둥근 바탕 밖으로 잘린다. -->
  <defs>
    <clipPath id="tile">
      <rect width="32" height="32" rx="7" />
    </clipPath>
  </defs>
  <rect width="32" height="32" rx="7" fill="#121110" />
  <g clip-path="url(#tile)">
    <g transform="translate(-3.2 -7.7) scale(1.3)">
      <rect x="9" y="11" width="10" height="16" rx="2" fill="#f5c84c" />
      <rect x="19" y="16.5" width="12" height="4" rx="1.5" fill="#f5c84c" />
      <g fill="none" stroke="#f5c84c" stroke-linejoin="round" stroke-linecap="round">
        <path d="M9 26 L5 21 L7.5 20 L3 13" stroke-width="1.8" />
        <path d="M8 27.5 L4 27 L5 25.5 L1 25" stroke-width="1.6" />
        <path d="M20 27.5 L24 26 L23.5 24.5 L28 24" stroke-width="1.6" />
      </g>
      <line x1="2" y1="29.5" x2="30" y2="29.5" stroke="#4a4126" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
