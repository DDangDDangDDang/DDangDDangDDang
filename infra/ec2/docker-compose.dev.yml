# dev 사이트 서버(infra/dev.tf): 웹·앱에 더해 MySQL·Redis도 이 서버의 컨테이너로 띄운다. (운영은 RDS·ElastiCache)
# Terraform이 SSM 파라미터로 올리고, 운영과 같은 deploy.sh가 배포할 때마다 받아서 쓴다.
# .env(APP_IMAGE, WEB_IMAGE), app.env, web.env, db.env(MySQL 계정)는 deploy.sh가 만든다.
#
# 요청 흐름: 브라우저 ─80/443─▶ web(Caddy) ─/api, /ws─▶ app(8080) ─▶ mysql(3306), redis(6379)
# MySQL·Redis 포트는 밖으로 열지 않는다. (같은 Compose 네트워크 안에서만 접속)
name: ddang

services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE가 필요합니다}
    env_file: [web.env]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    image: ${APP_IMAGE:?APP_IMAGE가 필요합니다}
    env_file: [app.env]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    # 서버 메모리 2GB를 MySQL·Redis·web과 나눠 쓴다. (힙은 이 한도의 75%)
    mem_limit: 1024m
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  mysql:
    image: mysql:8.4
    env_file: [db.env]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    volumes:
      # dev 데이터. 배포해도 남고, 서버를 다시 만들면 사라진다.
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7.4
    # 채팅 메시지 전달·토큰·캐시용. dev라 디스크에 저장하지 않는다.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 128m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
