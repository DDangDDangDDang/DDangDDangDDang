# EC2 구성: 이 서버에서는 앱만 실행하고, DB·Redis는 RDS·ElastiCache에 접속한다.
# Terraform이 SSM 파라미터로 올리고, deploy.sh가 배포할 때마다 받아서 쓴다. (서버에서 직접 고치지 않는다)
# .env(APP_IMAGE)와 app.env(DB·Redis 주소를 포함한 앱 환경변수, 비밀값)는 deploy.sh가 만든다.
name: ddang

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE가 필요합니다}
    env_file: [app.env]
    ports:
      - "80:8080"
    # 서버 메모리 2GB 중 OS·Docker 몫을 빼고 앱에 준다. (힙은 이 한도의 75%)
    mem_limit: 1536m
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
