services:
  mysql:
    image: mysql:8.4
    container_name: ddang-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ddang
      MYSQL_USER: ddang
      MYSQL_PASSWORD: ddang
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4
    container_name: ddang-redis
    ports:
      - "6379:6379"

volumes:
  mysql-data: