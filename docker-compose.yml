# 로컬 개발용 서비스. 비밀번호가 없거나(Redis) 파일에 그대로 적힌 값(MySQL, LiveKit)이라
# 같은 네트워크의 다른 PC가 접속하지 못하도록 모든 포트를 이 PC(127.0.0.1)에만 연다.
services:
  mysql:
    image: mysql:8.4
    container_name: ddang-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: ddang
      MYSQL_USER: ddang
      MYSQL_PASSWORD: ddang
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4
    container_name: ddang-redis
    ports:
      - "127.0.0.1:6379:6379"

  # LiveKit 미디어 서버. --dev 모드의 API 키는 공개된 기본값(devkey / secret)으로 application.yml 기본값과 같다.
  # --node-ip는 브라우저에게 알려줄 접속 주소일 뿐 포트 공개 범위와는 무관하다.
  livekit:
    image: livekit/livekit-server
    container_name: ddang-livekit
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"

volumes:
  mysql-data: